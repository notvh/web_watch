# version: '3.7'

services:
    database:
       image: mysql:8.0 # Use a specific version of MySQL
       container_name: mysql_db_webdongho
       environment:
            MYSQL_ROOT_PASSWORD: 123123 # Replace with a strong password
            MYSQL_DATABASE: laravel # Optional: create a default database
            MYSQL_USER: laravel # Optional: create a default user
            MYSQL_PASSWORD: laravel # Optional: password for the default user
            # MYSQL_ALLOW_EMPTY_PASSWORD: 1
       ports:
        - "3306:3306" # Maps host port 3306 to container port 3306
       volumes:
        - db_webdongho:/var/lib/mysql # Persist data oqutside the container
       restart: always # Ensure the container restarts automatically
       command: --default-authentication-plugin=mysql_native_password


volumes:
  db_webdongho: # Define the named volume for data persistence

networks:
    local:
